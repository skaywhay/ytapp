name: Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (Installer & Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Portable YT_Deck.exe
        run: |
          python -m PyInstaller --clean -y yt_deck.spec
          Copy-Item "dist\YT_Deck.exe" -Destination "YT_Deck.exe"
          Move-Item "dist\YT_Deck.exe" -Destination "YT_Deck-windows-portable.exe"

      - name: Build M3 YT_Deck_Setup.exe Installer
        run: |
          cd installer
          python -m PyInstaller --clean -y installer.spec
          Move-Item "dist\YT_Deck_Setup.exe" -Destination "..\YT_Deck_Setup.exe"
          cd ..

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            YT_Deck_Setup.exe
            YT_Deck-windows-portable.exe

  build-macos:
    name: Build macOS (.app / ZIP)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pyobjc-framework-WebKit

      - name: Build macOS Application Bundle
        run: |
          python3 -m PyInstaller --clean -y yt_deck.spec
          cd dist
          zip -r -9 ../YT_Deck-macOS.zip YT_Deck.app
          cd ..

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-binary
          path: YT_Deck-macOS.zip

  build-linux:
    name: Build Linux Standalone (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgirepository1.0-dev gir1.2-webkit2-4.1 python3-gi python3-dev pkg-config libcairo2-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Linux Standalone Executable
        run: |
          python3 -m PyInstaller --clean -y yt_deck.spec
          cd dist
          tar -czvf ../YT_Deck-linux-x86_64.tar.gz YT_Deck
          cd ..

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: YT_Deck-linux-x86_64.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    if: always() && !cancelled() && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
